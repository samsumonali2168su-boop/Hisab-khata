<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিসাব খাতা - Hisab Khata</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white p-4 shadow-md text-center">
        <h1 class="text-xl font-bold">আমার হিসাব খাতা</h1>
        <p class="text-xs text-indigo-200">লগইন ঝামেলা ছাড়াই নিরাপদ হিসাব রক্ষণ</p>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-md w-full mx-auto p-4">
        
        <!-- Status Bar -->
        <div id="status-box" class="bg-yellow-100 text-yellow-800 p-2 rounded mb-4 text-center text-sm">
            ফায়ারবেসের সাথে সংযোগ স্থাপন করা হচ্ছে...
        </div>

        <!-- Add Transaction Form -->
        <div class="bg-white p-4 rounded-lg shadow mb-6">
            <h2 class="text-lg font-semibold mb-3 text-gray-700">নতুন হিসাব যোগ করুন</h2>
            <form id="transaction-form" onsubmit="addTransaction(event)">
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1">বিবরণ (যেমন: বাজার খরচ)</label>
                    <input type="text" id="desc" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1">টাকার পরিমাণ</label>
                    <input type="number" id="amount" required class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="mb-3">
                    <label class="block text-sm text-gray-600 mb-1">ধরণ</label>
                    <select id="type" class="w-full border rounded p-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="income">आय (Income)</option>
                        <option value="expense" selected>ব্যয় (Expense)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded font-semibold hover:bg-indigo-700">সেভ করুন</button>
            </form>
        </div>

        <!-- Transaction History -->
        <div class="bg-white p-4 rounded-lg shadow">
            <h2 class="text-lg font-semibold mb-3 text-gray-700">লেনদেনের তালিকা</h2>
            <ul id="transaction-list" class="divide-y divide-gray-200">
                <li class="py-2 text-center text-gray-400 text-sm">কোনো ডেটা নেই</li>
            </ul>
        </div>
    </main>

    <!-- Firebase SDKs (Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addFirestoreData, getDocs, addDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // আপনার ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            apiKey: "AIzaSyDu5l43vAm...", // আপনার সম্পূর্ণ কী এখানে বসবে
            authDomain: "hisab-khata-d12af.firebaseapp.com",
            projectId: "hisab-khata-d12af",
            storageBucket: "hisab-khata-d12af.appspot.com",
            messagingSenderId: "320687165592",
            appId: "1:320687165592:web:..."
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // অটোমেটিক গেস্ট লগইন (সাইন-ইন ছাড়াই ফায়ারবেস কানেকশন)
        signInAnonymously(auth)
            .then(() => {
                document.getElementById('status-box').innerText = "অনলাইন ও সংযুক্ত (ফায়ারবেস সুরক্ষিত)";
                document.getElementById('status-box').className = "bg-green-100 text-green-800 p-2 rounded mb-4 text-center text-sm";
                loadTransactions();
            })
            .catch((error) => {
                document.getElementById('status-box').innerText = "সংযোগ ত্রুটি: " + error.message;
                document.getElementById('status-box').className = "bg-red-100 text-red-800 p-2 rounded mb-4 text-center text-sm";
            });

        // ডেটা সেভ করার ফাংশন
        window.addTransaction = async function(e) {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = document.getElementById('amount').value;
            const type = document.getElementById('type').value;

            try {
                await addDoc(collection(db, "transactions"), {
                    desc: desc,
                    amount: Number(amount),
                    type: type,
                    date: new Date().toLocaleDateString()
                });
                document.getElementById('transaction-form').reset();
                loadTransactions();
            } catch (err) {
                alert("ডেটা সেভ করতে সমস্যা হয়েছে: " + err.message);
            }
        }

        // ডেটা লোড করার ফাংশন
        async function loadTransactions() {
            const listEl = document.getElementById('transaction-list');
            listEl.innerHTML = '<li class="py-2 text-center text-gray-400 text-sm">লোড হচ্ছে...</li>';
            
            try {
                const querySnapshot = await getDocs(collection(db, "transactions"));
                listEl.innerHTML = '';
                if(querySnapshot.empty) {
                    listEl.innerHTML = '<li class="py-2 text-center text-gray-400 text-sm">কোনো ডেটা পাওয়া যায়নি</li>';
                    return;
                }
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const color = data.type === 'income' ? 'text-green-600' : 'text-red-600';
                    listEl.innerHTML += `
                        <li class="py-2 flex justify-between items-center">
                            <span>${data.desc} (${data.date})</span>
                            <span class="${color} font-bold">${data.amount} ৳</span>
                        </li>
                    `;
                });
            } catch (err) {
                listEl.innerHTML = '<li class="py-2 text-center text-red-400 text-sm">ডেটা লোড করতে সমস্যা হয়েছে</li>';
            }
        }
    </script>
</body>
</html>
